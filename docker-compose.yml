services:
  app:
    image: tls-rest:latest
    build:
      context: .
      dockerfile: Dockerfile
      # Pass a version for the ?v=… asset cache-buster on a local `compose build`:
      #   APP_VERSION=$(git rev-parse --short=8 HEAD) docker compose up --build
      # Jenkins builds the image itself with --build-arg and deploys --no-build.
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: tls-rest
    restart: always
    stdin_open: true
    tty: true
    ports:
      - "8443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENV=production
    volumes:
      - /opt/workstation/certs/cert.pem:/app/.private/cert.pem:ro
      - /opt/workstation/certs/key.pem:/app/.private/key.pem:ro
      - /opt/workstation/.env:/app/.private/.env:ro
    networks:
      - workstation_infra_net

networks:
  workstation_infra_net:
    external: true